[package]
name = "space-balloon-predictor-rs-server"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
name = "space_balloon_predictor_rs_server"
path = "src/lib.rs"

[[bin]]
name = "space-balloon-predictor-rs-server"
path = "src/main.rs"

[dependencies]
axum = "0.8"
chrono = { workspace = true, features = ["std", "clock"] }
env_logger = { workspace = true }
log = { workspace = true }
reqwest = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
space-balloon-predictor-rs = { path = "../core" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower-http = { version = "0.6", features = ["cors"] }
