name: Preview Release

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: preview-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: ubuntu-latest
            args: ''
          - os: windows-latest
            args: '--no-self-update'
          - os: macos-latest
            args: ''

    runs-on: ${{ matrix.platform.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Linux dependencies
        if: matrix.platform.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf
        env:
          DEBIAN_FRONTEND: noninteractive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Package and publish preview
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: preview-${{ github.sha }}
          releaseName: "Preview ${{ github.sha }}"
          releaseBody: "Auto-generated preview release for commit `${{ github.sha }}`."
          prerelease: true
          publish: true

  cleanup:
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Cleanup old preview releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASES=$(gh release list --limit 100 --json tagName -q '.[] | select(.tagName | startswith("preview-")) | .tagName')
          CURRENT="preview-${{ github.sha }}"
          for TAG in $RELEASES; do
            if [ "$TAG" != "$CURRENT" ]; then
              echo "Deleting old preview release: $TAG"
              gh release delete "$TAG" --yes --cleanup-tag
            fi
          done
